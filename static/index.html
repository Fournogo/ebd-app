<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon-lg-OctPXU2T.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EBD Value Generator</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0d1117;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #0d1117;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4fc3f7;
        animation: loader-bounce 1.1s infinite ease-in-out both;
      }
      #app-loader span:nth-child(1) { animation-delay: -0.32s; }
      #app-loader span:nth-child(2) { animation-delay: -0.16s; }
      #app-loader span:nth-child(3) { animation-delay: 0s; }
      @keyframes loader-bounce {
        0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
        40%            { transform: scale(1);   opacity: 1;   }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">

  </head>

      <span></span><span></span><span></span>
    </div>
    <div id="root"></div>
  </body>
